[project]
name = "pubmed-retrieval-notebooks"
version = "0.1.0"
description = "PubMed, PMC, and GEO retrieval notebooks for survival RNA-seq dataset discovery"
requires-python = ">=3.12,<3.15"
dependencies = [
  "biopython",
  "geoparse",
  "ipykernel",
  "jupyterlab",
  "matplotlib",
  "openai",
  "pandas",
  "pydantic",
  "requests",
  "tiktoken",
  "ujson",
  "urllib3",
]

[tool.uv]
package = false
